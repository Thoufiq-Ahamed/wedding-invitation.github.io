<html>
	<head>
		<title>
			Wedding Invitation
		</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles.css">
		<link href='https://fonts.googleapis.com/css?family=Manufacturing Consent' rel='stylesheet'>
		<script>			
			// Set the date we're counting down to
			var countDownDate = new Date("Dec 25, 2025 12:00:00").getTime();
			
			// Update the count down every 1 second
			var x = setInterval(function() {
			
				// Get today's date and time
				var now = new Date().getTime();
					
				// Find the distance between now and the count down date
				var distance = countDownDate - now;
				
				var formatTwoDigits = (num) => String(num).padStart(2, '0');
					
				// Time calculations for days, hours, minutes and seconds
				var days = Math.floor(distance / (1000 * 60 * 60 * 24));
				var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				var seconds = Math.floor((distance % (1000 * 60)) / 1000);
					
				// Output the result in an element
				document.getElementById("days").innerHTML = formatTwoDigits(days);
				document.getElementById("hours").innerHTML = formatTwoDigits(hours);
				document.getElementById("minutes").innerHTML = formatTwoDigits(minutes);
				document.getElementById("seconds").innerHTML = formatTwoDigits(seconds);
					
				// If the count down is over, write some text 
				if (distance < 0) {
					clearInterval(x);
					document.getElementById("countdown").innerHTML = "You miss the moment !!!";
				}
				else
				{
					document.getElementById("countdown").innerHTML = "COUNTDOWN...";
				}
			}, 1000);
		</script>
	</head>
	<body>
		<div id="invitationpanel" class="invitationpanel">
			<div class="quotes">
				<p translate="no" style="text-align:center;font-size:15px;"><i>بسم الله الرحمن الرحيم</i></p>
				<p translate="no" style="text-align:center;font-size:30px;">هُنَّ لِباسٌ لَكُم وَأَنتُم لِباسٌ لَهُنَّ</p>
				<p style="text-align:center;font-size:20px;">“Your spouses are a garment for you as you are for them”</p>
				<p style="text-align:center;font-size:15px;"> - Surah - Al - Baqarah , 2:187</p>
			</div>
			<div id="maincontent" class="coverpage">
				<img class="responsive" src="invitation_jpg.jpg" alt="invitation_details">
			</div>
			<div id="details" class="details">
				<div class="countdown">
					<h1 id="countdown"></h1>
				</div>
				<div id="timer">
					<table class="timer">
						<tr>
							<td id="days" class="timer"></td><td class="separator">:</td>
							<td id="hours" class="timer"></td><td class="separator">:</td>
							<td id="minutes" class="timer"></td><td class="separator">:</td>
							<td id="seconds" class="timer"></td>
						</tr>
						<tr>
							<th class="timeheading">DAYS</th><th class="separator"></th>
							<th class="timeheading">HOURS</th><th class="separator"></th>
							<th class="timeheading">MINUTES</th><th class="separator"></th>
							<th class="timeheading">SECONDS</th>
						</tr>
					</table>
				</div>	
				<hr>
				<div id="otherdetails" class="grid-container">
					<div class="grid-item">
						<p><b>WEDDING LOCATION:</b></p>
						<p>A.J.K. Mahal,</p>
						<p>Ganapathy Nagar,</p>
						<p>Mayiladuthurai.</p>
					</div>
					<div class="grid-item">
						<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3915.1664490503313!2d79.6435206!3d11.100969599999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5527bf87960791%3A0xb1ec1f576ee1f91d!2zQUpLIE1BSEFMIOCujy7grpzgr4cu4K6V4K-HLiDgrq7grrngrr7grrLgr40!5e0!3m2!1sen!2sae!4v1758374171167!5m2!1sen!2sae" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
					</div>
				</div>
			</div>
		</div>
	</body>

</html>
